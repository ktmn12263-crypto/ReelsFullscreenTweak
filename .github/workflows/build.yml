name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build tools (make, ldid)
        run: brew install make ldid

      - name: Set PATH and THEOS env vars
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Build package
        run: make package THEOS="$THEOS"

      - name: Upload .deb / .dylib artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReelsFullscreenToggle-build
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
