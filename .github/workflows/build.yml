name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: theosorg/theos:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build package
        env:
          THEOS: /var/theos
        run: |
          make package THEOS=$THEOS

      - name: Upload .deb / .dylib artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReelsFullscreenToggle-build
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
